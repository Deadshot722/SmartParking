<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - CECyT 9</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <nav>
    <a href="./index.html">Talleres</a>
    <a href="./registro.html">Iniciar sesión</a>
  </nav>

  <main class="contenedor-login">
    <div class="tarjeta-login">
      <h1>Iniciar sesión</h1>
      
      <form action="#" method="POST" class="formulario-login">
        <div class="campo">
          <label for="correo">Correo <span>*</span></label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@ipn.mx" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña <span>*</span></label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="boton-login">Entrar</button>
      </form>
    </div>
  </main>

</body>
</html>
